<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实信达档案数字化闯关之旅</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dce4ee;border-radius:22px;padding:24px}.center{text-align:center}.muted{color:#667085}.paper{width:78px;height:96px;border:2px solid #dce4ee;border-radius:9px;margin:4px auto 18px;display:grid;place-items:center;font-size:34px;background:#f6f8fb}h1{font-size:27px;line-height:1.35;margin:8px 0}h2{font-size:20px;margin:6px 0}.lead{line-height:1.75;color:#667085}.primary{border:0;border-radius:12px;background:#1769e0;color:white;padding:13px 20px;font-weight:700;min-height:46px;cursor:pointer}.primary:disabled{opacity:.4}.hidden{display:none}.top{display:flex;justify-content:space-between;gap:12px;align-items:end}.bar{height:8px;background:#e8edf3;border-radius:99px;overflow:hidden;margin:10px 0 18px}.fill{height:100%;background:#1769e0;transition:width .35s}.route{display:flex;align-items:center;overflow-x:auto;padding:10px 3px 18px}.dot{min-width:42px;width:42px;height:42px;border:2px solid #dce4ee;border-radius:50%;background:#fff;display:grid;place-items:center}.dot.on{border-color:#1769e0;background:#eaf3ff}.line{min-width:20px;flex:1;height:2px;background:#dce4ee}.line.on{background:#1769e0}.stage{display:flex;gap:15px}.hero{width:64px;height:76px;flex:0 0 auto;border:2px solid #dce4ee;border-radius:10px;background:#f6f8fb;display:grid;place-items:center;font-size:30px}.tag{font-size:12px;font-weight:800;color:#1769e0}.challenge{margin-top:18px;padding:16px;background:#f6f8fb;border-radius:15px}.q{font-weight:650;line-height:1.6}.choices{display:grid;gap:9px;margin-top:12px}.choice{min-height:46px;text-align:left;padding:11px 13px;border:1px solid #dce4ee;border-radius:11px;background:#fff;cursor:pointer}.choice.good{border-color:#16865c;color:#16865c}.choice.bad{border-color:#c13d3d;color:#c13d3d}.feedback{margin-top:11px;line-height:1.6}.next{width:100%;margin-top:15px}.four{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.four div{padding:16px;background:#f6f8fb;border-radius:12px;font-weight:700}.brand{border-top:1px solid #dce4ee;margin-top:20px;padding-top:18px}.ghost{border:1px solid #dce4ee;background:#fff;border-radius:12px;padding:11px 18px;cursor:pointer}
@media(max-width:480px){.wrap{padding:12px}.card{padding:19px}h1{font-size:24px}.hero{width:56px;height:68px}}
</style></head><body><main class="wrap">
<section id="intro" class="card center"><div class="paper">📄</div><div class="muted">实信达档案小课堂 · 互动科普 01</div><h1>一份纸质档案的<br>数字化闯关之旅</h1><p class="lead">它要经历哪些步骤，才能从一张纸变成真正可以查询、管理和利用的数字资源？</p><button id="start" class="primary">开始数字化 →</button></section>
<section id="game" class="hidden"><div class="top"><div><small class="muted">数字化进度</small><br><b id="level"></b></div><b id="count"></b></div><div class="bar"><div id="fill" class="fill"></div></div><div id="route" class="route"></div><div class="card"><div class="stage"><div id="hero" class="hero"></div><div><div id="tag" class="tag"></div><h2 id="title"></h2><div id="text" class="lead"></div></div></div><div class="challenge"><small class="muted"><b>🎯 本关挑战</b></small><div id="question" class="q"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback hidden"></div></div><button id="next" class="primary next" disabled>完成挑战后继续 →</button></div></section>
<section id="finish" class="card center hidden"><div style="font-size:48px">🏆</div><div class="muted">数字化闯关完成</div><h1>纸质档案 → 数字资源</h1><p class="lead">扫描不是终点。真正好用的数字化成果，最后要经得起这四个问题。</p><div class="four"><div>👁️ 看得清</div><div>🔗 对得上</div><div>🔎 找得到</div><div>✨ 用得起来</div></div><div class="brand"><b>实信达档案小课堂</b><div class="muted" style="font-size:13px;margin-top:6px">让档案被妥善保存，也让数据真正发挥价值。</div></div><button id="again" class="ghost" style="margin-top:18px">再玩一次</button></section>
</main><script>
const S=[
["📁","前期准备","档案准备好了吗？","正式扫描前，先检查完整性、页面顺序、破损情况和整理状态。","发现档案中有一页折角遮住了部分文字，应该怎么做？",["不管它，直接扫描","先按项目要求妥善处理，再进入扫描"],1,"对啦。前处理可以避免把原有问题直接带进数字化成果。"],
["🖨️","扫描采集","不是“扫过”，而是“扫清楚”","通过扫描形成数字图像，文字、印章、批注等应保留的信息需要清晰呈现。","扫描后印章内容模糊难辨，怎么办？",["只要生成文件就算完成","检查原因并按要求重新采集"],1,"正确。数字图像应准确反映原件中的有效信息。"],
["🖼️","图像处理","档案不是拿来“美颜”的","偏斜、方向错误等情况可按要求处理，目的不是美化，而是准确反映原件。","扫描图像有些歪，应该怎么处理？",["尽量修得漂亮","按要求纠偏，同时保持信息真实完整"],1,"过关。图像处理追求准确、完整，不是滤镜效果。"],
["🔗","著录挂接","这份文件到底是谁的？","目录信息和数字图像需要正确关联，查询时才能准确找到对应原文。","点击“2025年度项目报告”，却打开了另一份档案。最可能是什么问题？",["数据挂接错误","扫描仪颜色不够好"],0,"答对了。目录与数字图像对不上号，后续查询就会出问题。"],
["🔎","OCR识别","人能看见，电脑为什么搜不到？","OCR识别图像中的文字，使内容可以进一步检索和处理。","PDF很清楚，但搜索“项目验收”没有结果，可能缺少什么？",["OCR文字识别","把页面放大一点"],0,"正确。扫描解决“看得到”，OCR进一步帮助实现“搜得到”。"],
["✅","质量检查","来当一次数字档案“找茬员”","检查漏扫、重扫、图像质量、顺序、目录信息和数据关联等问题。","第28页之后直接跳到了第30页，首先应该关注什么？",["可能存在漏扫或页面顺序问题","把文件名改得更漂亮"],0,"找到问题啦。质检就是把影响成果完整性和使用的问题找出来。"],
["🗄️","管理利用","通关，但价值才刚开始","数字化成果进入相应系统后，可进一步用于存储、查询、检索和利用。","哪句话更接近数字化成果的最终价值？",["电脑里文件越多越好","能够规范管理，并真正支持查询和利用"],1,"通关！数字化不是为了多一份电子文件，而是为了形成真正可管理、可利用的数字资源。"]];
let i=0,P=Array(S.length).fill(false);const $=x=>document.getElementById(x);
function draw(){let d=S[i];$("level").textContent=`第 ${i+1} 关 · ${d[1]}`;$("count").textContent=`${i+1} / ${S.length}`;$("fill").style.width=`${(i+1)/S.length*100}%`;$("hero").textContent=d[0];$("tag").textContent=`LEVEL ${String(i+1).padStart(2,"0")}`;$("title").textContent=d[2];$("text").textContent=d[3];$("question").textContent=d[4];$("feedback").className="feedback hidden";$("choices").innerHTML="";d[5].forEach((v,k)=>{let b=document.createElement("button");b.className="choice";b.textContent=v;b.onclick=()=>answer(k,b);$("choices").appendChild(b)});$("next").disabled=!P[i];$("next").textContent=P[i]?(i===6?"查看通关结果 →":"进入下一关 →"):"完成挑战后继续 →";$("route").innerHTML="";S.forEach((s,k)=>{let b=document.createElement("button");b.className="dot "+(k<=i?"on":"");b.textContent=s[0];$("route").appendChild(b);if(k<6){let l=document.createElement("div");l.className="line "+(k<i?"on":"");$("route").appendChild(l)}})}
function answer(k,b){let d=S[i],all=[...$("choices").children];all.forEach(x=>x.disabled=true);$("feedback").classList.remove("hidden");if(k===d[6]){P[i]=true;b.classList.add("good");$("feedback").textContent="✓ "+d[7];$("feedback").style.color="#16865c";$("next").disabled=false;$("next").textContent=i===6?"查看通关结果 →":"进入下一关 →"}else{b.classList.add("bad");$("feedback").textContent="再想一下："+d[3];$("feedback").style.color="#667085";setTimeout(()=>all.forEach(x=>x.disabled=false),500)}}
$("start").onclick=()=>{$("intro").classList.add("hidden");$("game").classList.remove("hidden");draw()};$("next").onclick=()=>{if(!P[i])return;if(i<6){i++;draw()}else{$("game").classList.add("hidden");$("finish").classList.remove("hidden")}};$("again").onclick=()=>{i=0;P=Array(7).fill(false);$("finish").classList.add("hidden");$("intro").classList.remove("hidden")};
</script></body></html>
